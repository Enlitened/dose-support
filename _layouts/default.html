<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1a1a1a;
      --paper: #fffdf8;
      --muted: #555;
      --rule: #d9d4c7;
      --link: #0a4fa3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2efe8;
        --paper: #17181a;
        --muted: #b8b4ab;
        --rule: #3a3c40;
        --link: #8ab8ff;
      }
    }
    html { font-size: 20px; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    header, main, footer {
      max-width: 38em;
      margin: 0 auto;
      padding: 0 1.25rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 1.25rem;
      padding-top: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--rule);
    }
    header .brand {
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--ink);
    }
    header nav a {
      margin-right: 1.25rem;
      font-size: 1.05rem;
    }
    main { padding-top: 1rem; padding-bottom: 3rem; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 1rem 0 0.75rem; }
    h2 { font-size: 1.45rem; line-height: 1.25; margin: 2.25rem 0 0.5rem; }
    h3 { font-size: 1.15rem; margin: 1.5rem 0 0.4rem; }
    p, li { font-size: 1rem; }
    li { margin-bottom: 0.35rem; }
    ol, ul { padding-left: 1.5rem; }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 0.15em; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
    strong { font-weight: 700; }
    em { font-style: italic; color: var(--muted); }
    hr { border: 0; border-top: 2px solid var(--rule); margin: 2rem 0; }
    footer {
      padding-top: 1rem;
      padding-bottom: 2.5rem;
      border-top: 2px solid var(--rule);
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">Dose</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Support</a>
      <a href="{{ '/privacy' | relative_url }}">Privacy policy</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Dose is a personal record, not medical advice. Always follow the directions from your doctor or pharmacist.
  </footer>
</body>
</html>
